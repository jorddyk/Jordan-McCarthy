name: ChatGPT Whisper model fetch

on:
  push:
    branches:
      - chatgpt/whisper-model-fetch-20260819
    paths:
      - .github/workflows/chatgpt-whisper-model-fetch.yml

permissions:
  contents: read

env:
  MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin?download=true
  MODEL_SHA256: c77c5766f1cef09b6b7d47f21b546cbddd4157886b3b5d6d4f709e91e66c7c2b

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download public Whisper model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --output ggml-tiny.en-q5_1.bin "$MODEL_URL"
          echo "$MODEL_SHA256  ggml-tiny.en-q5_1.bin" | sha256sum --check --strict
          ls -lh ggml-tiny.en-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-ggml-tiny-en-q5_1
          path: ggml-tiny.en-q5_1.bin
          if-no-files-found: error
          retention-days: 1
