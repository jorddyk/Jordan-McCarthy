name: Rongorongo Phase19 Corpus Extract

on:
  push:
    branches:
      - rongorongo-phase19-temp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract-text-t:
    runs-on: ubuntu-latest
    steps:
      - name: Download published data bundle and isolate Text T
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown 1NGg7459yIo1Xky-rvDBwSMqZ0rYTFb_X -O hackingrongo_data.zip
          python - <<'PY'
          import hashlib, json, zipfile
          z = zipfile.ZipFile('hackingrongo_data.zip')
          candidates = [n for n in z.namelist() if n.endswith('/corpus/T.json') or n == 'data/corpus/T.json']
          if len(candidates) != 1:
              raise SystemExit(f'Expected one Text T corpus file; found {len(candidates)}')
          data = json.loads(z.read(candidates[0]))
          raw = json.dumps(data, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          open('phase19_text_T.json', 'wb').write(raw)
          open('phase19_text_T.sha256', 'w').write(hashlib.sha256(raw).hexdigest() + '  phase19_text_T.json\n')
          print('Text T isolated without printing transcription')
          PY
      - name: Upload sealed corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase19-text-t-corpus
          path: |
            phase19_text_T.json
            phase19_text_T.sha256
          retention-days: 1
