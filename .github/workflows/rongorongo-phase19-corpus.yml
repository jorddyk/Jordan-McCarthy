name: Rongorongo Phase19 Corpus Extract

on:
  push:
    branches:
      - rongorongo-phase19-temp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract-text-t:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and seal Text T XML without printing transcription
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, requests
          url='http://kohaumotu.org/Rongorongo/xml/T.xml'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 research audit'},timeout=120)
          r.raise_for_status()
          raw=r.content
          if raw.lower().count(b'<ceipp>') < 100:
              raise SystemExit('Unexpectedly sparse Text T XML')
          open('phase19_text_T.xml','wb').write(raw)
          open('phase19_text_T.sha256','w').write(hashlib.sha256(raw).hexdigest()+'  phase19_text_T.xml\n')
          print('Text T XML sealed; transcription not printed')
          PY
      - name: Upload sealed Text T artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase19-text-t-corpus
          path: |
            phase19_text_T.xml
            phase19_text_T.sha256
          retention-days: 1
