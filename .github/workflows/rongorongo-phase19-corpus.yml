name: Rongorongo Phase19 Tracing Fetch

on:
  push:
    branches:
      - rongorongo-phase19-temp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-tracings:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Text T tracing resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          h={'User-Agent':'RongorongoResearch/1.0 (audit; contact via GitHub)'}
          sources=[
            ('Barthel_Ta.png','https://en.wikipedia.org/wiki/Special:Redirect/file/Barthel_Ta.png?width=2000'),
            ('display_tablet_svg.xsl','http://kohaumotu.org/Rongorongo/xml/display_tablet_svg.xsl'),
          ]
          ok=0
          for fn,u in sources:
              r=requests.get(u,headers=h,timeout=120,allow_redirects=True)
              print(fn,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
              if r.status_code==200 and len(r.content)>500:
                  open(fn,'wb').write(r.content);ok+=1
          if ok<2: raise SystemExit(f'Only {ok} resources fetched')
          PY
      - name: Upload tracing resources
        uses: actions/upload-artifact@v4
        with:
          name: phase19-text-t-tracings
          path: |
            Barthel_Ta.png
            display_tablet_svg.xsl
          retention-days: 1
