name: Rongorongo Phase19 Tracing Fetch

on:
  push:
    branches:
      - rongorongo-phase19-temp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-tracings:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Text T tracing resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          h={'User-Agent':'Mozilla/5.0 research audit'}
          urls={
            'Barthel_Ta.png':'https://upload.wikimedia.org/wikipedia/commons/a/a6/Barthel_Ta.png',
            'display_tablet_svg.xsl':'http://kohaumotu.org/Rongorongo/xml/display_tablet_svg.xsl',
          }
          for fn,u in urls.items():
              r=requests.get(u,headers=h,timeout=120);r.raise_for_status();open(fn,'wb').write(r.content)
              print(fn, len(r.content), r.headers.get('content-type'))
          PY
      - name: Upload tracing resources
        uses: actions/upload-artifact@v4
        with:
          name: phase19-text-t-tracings
          path: |
            Barthel_Ta.png
            display_tablet_svg.xsl
          retention-days: 1
