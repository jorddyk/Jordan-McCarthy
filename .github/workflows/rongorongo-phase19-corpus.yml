name: Rongorongo Phase19 Segment Fetch

on:
  push:
    branches:
      - rongorongo-phase19-temp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-segments:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and render decisive Text T segments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet cairosvg requests
          python - <<'PY'
          import requests, cairosvg
          h={'User-Agent':'RongorongoResearch/1.0 (audit; contact via GitHub)'}
          names=['Ta0202','Ta0301','Ta0402','Ta0501','Ta0601','Ta0602','Ta0901','Ta1001']
          for n in names:
              u=f'http://kohaumotu.org/Rongorongo/images/svg/T/{n}.svg'
              r=requests.get(u,headers=h,timeout=120);r.raise_for_status()
              open(n+'.svg','wb').write(r.content)
              cairosvg.svg2png(bytestring=r.content,write_to=n+'.png',scale=3)
              print(n,len(r.content))
          PY
      - name: Upload rendered segments
        uses: actions/upload-artifact@v4
        with:
          name: phase19-text-t-segments
          path: |
            Ta*.svg
            Ta*.png
          retention-days: 1
