name: Assemble JM105 uploaded sources

on:
  push:
    branches:
      - agent/add-jm105-figure-analysis-scripts-20260730
    paths:
      - .github/workflows/jm105-upload-assembly.yml
      - .staging/jm105-upload/**

permissions:
  contents: write

jobs:
  assemble-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/add-jm105-figure-analysis-scripts-20260730

      - name: Reconstruct exact large source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/jm105-intronsaurus/analysis/figure6-metazoan-conservation
          mkdir -p projects/figure-rendering/diagnostics/jm105-figure3-cr-selectivity
          mkdir -p projects/figure-rendering/reference-renderers/jm105-figure4-mud1-coupling

          cat .staging/jm105-upload/discovery.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > projects/jm105-intronsaurus/analysis/figure6-metazoan-conservation/JM105_figure6_discovery_20260729.py

          cat .staging/jm105-upload/figure3.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > projects/figure-rendering/diagnostics/jm105-figure3-cr-selectivity/JM105_figure3_render_v2_1_20260728.py

          cat .staging/jm105-upload/figure4.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > projects/figure-rendering/reference-renderers/jm105-figure4-mud1-coupling/JM105_figure4_render_v11_2_20260729.py

      - name: Verify exact Git object identities
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local expected="$1"
            local path="$2"
            local actual
            actual="$(git hash-object "$path")"
            printf '%s  %s\n' "$actual" "$path"
            test "$actual" = "$expected"
          }

          check_blob a0b82ac334a22d575ce056c5527ce07096357cdb \
            projects/jm105-intronsaurus/analysis/figure6-metazoan-conservation/JM105_figure6_discovery_20260729.py
          check_blob d78d526473367faba93c31c9e3131a721172f919 \
            projects/figure-rendering/diagnostics/jm105-figure3-cr-selectivity/JM105_figure3_render_v2_1_20260728.py
          check_blob 975a98f10debcbdf77bd769d6ab0ad5bf716266a \
            projects/figure-rendering/reference-renderers/jm105-figure4-mud1-coupling/JM105_figure4_render_v11_2_20260729.py
          check_blob 85da57595c5c53e230da721019af346456d2835e \
            projects/jm105-intronsaurus/analysis/figure6-metazoan-conservation/JM105_figure6_aging_expression_confounder_20260729.py
          check_blob 3b7c8df405a2902f4f773d4c64ba79513e5411e9 \
            projects/jm105-intronsaurus/analysis/figure6-metazoan-conservation/JM105_figure6_human_gate_20260729.py
          check_blob 689a2eafba40d8fff134e5780b69455fbddce99f \
            projects/jm105-intronsaurus/analysis/figure6-metazoan-conservation/JM105_figure6_human_expression_20260729.py
          check_blob 202ed98185ef69af77a2a8b8a1c2095e2c3ea36f \
            projects/jm105-intronsaurus/analysis/jm100-lifespan/JM100_lifespan_to_csv_20260728.py

      - name: Compile every uploaded Python source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            projects/jm105-intronsaurus/analysis/figure6-metazoan-conservation/JM105_figure6_aging_expression_confounder_20260729.py \
            projects/jm105-intronsaurus/analysis/figure6-metazoan-conservation/JM105_figure6_discovery_20260729.py \
            projects/jm105-intronsaurus/analysis/figure6-metazoan-conservation/JM105_figure6_human_expression_20260729.py \
            projects/jm105-intronsaurus/analysis/figure6-metazoan-conservation/JM105_figure6_human_gate_20260729.py \
            projects/jm105-intronsaurus/analysis/jm100-lifespan/JM100_lifespan_to_csv_20260728.py \
            projects/figure-rendering/diagnostics/jm105-figure3-cr-selectivity/JM105_figure3_render_v2_1_20260728.py \
            projects/figure-rendering/reference-renderers/jm105-figure4-mud1-coupling/JM105_figure4_render_v11_2_20260729.py
          find projects -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Replace staging with verified sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging/jm105-upload
          rm -f .github/workflows/jm105-upload-assembly.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Assemble and verify uploaded JM105 analysis sources"
          git push origin HEAD:agent/add-jm105-figure-analysis-scripts-20260730
