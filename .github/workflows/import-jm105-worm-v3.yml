name: Import JM105 C elegans public RNA-seq v3

on:
  push:
    branches:
      - agent/add-hgps-metazoan-conservation-pipeline
    paths:
      - .github/workflows/import-jm105-worm-v3.yml
      - .github/import-payloads/jm105-worm-v3.part-*

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify exact source payload
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/jm105-worm-v3.tar.gz"
          cat .github/import-payloads/jm105-worm-v3.part-* | base64 --decode > "$ARCHIVE"
          printf '%s  %s\n' \
            '5769571d2d96ac891da237bdbc270babf87993fd94cdab5043a5479bc75e1715' \
            "$ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C .

      - name: Validate canonical source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=projects/jm105-intronsaurus/c-elegans-public-rnaseq
          python -m py_compile "$ROOT"/scripts/*.py
          rm -rf "$ROOT/scripts/__pycache__"
          bash -n \
            "$ROOT/submit_pipeline.sh" \
            "$ROOT/watch_pipeline.sh" \
            "$ROOT"/slurm/*.sbatch
          (
            cd "$ROOT"
            sha256sum --check --strict SOURCE_MANIFEST.sha256
          )
          if find "$ROOT" -type f \( \
              -name '*.fastq' -o -name '*.fastq.gz' -o -name '*.sra' -o \
              -name '*.bam' -o -name '*.bai' -o -name '*.sam' -o \
              -name '*.cram' -o -name '*.pyc' -o -name '*.zip' -o \
              -name '*.tar' -o -name '*.tar.gz' -o -name '*.log' \
            \) | grep -q .; then
            echo 'Forbidden generated/raw/archive file detected.' >&2
            exit 1
          fi
          grep -F 'PIPELINE_VERSION = "2026-07-22.3"' "$ROOT/scripts/common.py"
          grep -F 'PIPELINE_VERSION=2026-07-22.3' "$ROOT/slurm/00_driver.sbatch"
          grep -F 'GSE240821_GSM_GROUPS = {' "$ROOT/scripts/build_manifest.py"
          grep -F 'No bbox_inches="tight" is used' "$ROOT/scripts/aggregate_and_render.py"

      - name: Remove one-use importer and commit canonical files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/import-jm105-worm-v3.yml \
            .github/import-payloads/jm105-worm-v3.part-*
          rmdir .github/import-payloads 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add JM105 C elegans public RNA-seq v3 workflow'
          git push
