name: RR F6R1 JM A1 sealed test

on:
  push:
    branches:
      - rr/f6r1-jm-a1-sealed
    paths:
      - projects/rongorongo/sealed_f6r1_jm_a1/**
      - .github/workflows/rr-f6r1-jm-a1-sealed.yml
  pull_request:
    paths:
      - projects/rongorongo/sealed_f6r1_jm_a1/**
      - .github/workflows/rr-f6r1-jm-a1-sealed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sealed-construction-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out frozen runner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn

      - name: Generate frozen predictions, truth, and scores
        env:
          RR_OUT: sealed_output
          PYTHONHASHSEED: '0'
        run: python projects/rongorongo/sealed_f6r1_jm_a1/run.py

      - name: Fetch original tracings only after predictions exist
        run: |
          test -s sealed_output/predictions/predictions.csv
          test -s sealed_output/predictions/manifest.json
          python projects/rongorongo/sealed_f6r1_jm_a1/fetch_tracings.py

      - name: Upload prediction artifact
        uses: actions/upload-artifact@v4
        with:
          name: rr-f6r1-jm-a1-predictions
          path: sealed_output/predictions/
          if-no-files-found: error
          retention-days: 30

      - name: Upload sealed truth artifact
        uses: actions/upload-artifact@v4
        with:
          name: rr-f6r1-jm-a1-truth
          path: sealed_output/truth/
          if-no-files-found: error
          retention-days: 30

      - name: Upload score artifact
        uses: actions/upload-artifact@v4
        with:
          name: rr-f6r1-jm-a1-results
          path: sealed_output/results/
          if-no-files-found: error
          retention-days: 30
