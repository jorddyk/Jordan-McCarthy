name: Import exact JM105 distributed sources

on:
  push:
    branches:
      - agent/add-hgps-metazoan-conservation-pipeline
    paths:
      - .github/workflows/import-jm105-exact-sources.yml

permissions:
  contents: write

jobs:
  import-exact-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact Python sources
        shell: bash
        run: |
          set -euo pipefail
          target_dir="projects/jm105-intronsaurus/human-metazoan-conservation/scripts"
          mkdir -p "$target_dir"

          cat .source-import/run_hgps_metazoan_conservation.py.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > "$target_dir/run_hgps_metazoan_conservation.py"

          cat .source-import/jm105_metazoan_distributed.py.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > "$target_dir/jm105_metazoan_distributed.py"

          printf '%s  %s\n' \
            'b96291fba04cea6f009c4528666a78ae6d68ef7ee21920f20dbb5c02050c6365' \
            "$target_dir/run_hgps_metazoan_conservation.py" \
            | sha256sum --check --strict

          printf '%s  %s\n' \
            'dcd158728111d57071c2d48e3522be66a7e173fe71fb37138c05d87d40772649' \
            "$target_dir/jm105_metazoan_distributed.py" \
            | sha256sum --check --strict

          python -m py_compile \
            "$target_dir/run_hgps_metazoan_conservation.py" \
            "$target_dir/run_hgps_metazoan_conservation_manifest_hotfix.py" \
            "$target_dir/jm105_metazoan_distributed.py"
          rm -rf "$target_dir/__pycache__"

      - name: Mark exact sources canonical and remove importer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          project = Path('projects/jm105-intronsaurus/README.md')
          text = project.read_text(encoding='utf-8')
          text = text.replace(
              '| `human-metazoan-conservation/scripts/run_hgps_metazoan_conservation.py` | canonical lineage; exact v2 byte import pending |',
              '| `human-metazoan-conservation/scripts/run_hgps_metazoan_conservation.py` | canonical exact v2 source |',
          )
          text = text.replace(
              '| `human-metazoan-conservation/scripts/jm105_metazoan_distributed.py` | exact source verified locally; GitHub byte import pending |',
              '| `human-metazoan-conservation/scripts/jm105_metazoan_distributed.py` | canonical exact distributed implementation |',
          )
          old = '''## Exact-source import status — 2026-07-21

          The complete v2 source bundle was syntax-validated locally and its SHA-256 manifest is preserved. All methods, provenance, manifests, repair code and small execution helpers are present on draft PR #6. The two large Python files remain explicitly `PARTIAL / EXACT SOURCE VERIFIED LOCALLY` until connector-safe byte-for-byte import is completed; this status must not be upgraded based on descriptions or snippets.
          '''
          new = '''## Exact-source import status — 2026-07-21

          The complete v2 source bundle is canonical on draft PR #6. Both large Python files were reconstructed from gzip/base64 source chunks, verified against their prespecified SHA-256 values, compiled successfully, and committed. The one-use importer and temporary source chunks were removed in the same commit.
          '''
          text = text.replace(old, new)
          project.write_text(text, encoding='utf-8')

          handoff = Path('docs/handoffs/2026-07-21-jm105-hgps-distributed-methods-and-lock-repair.md')
          text = handoff.read_text(encoding='utf-8')
          text = text.replace(
              'The methods, manifest, runtime provenance, repair workflow, and all small launchers/helpers are canonicalized in draft PR #6. The two large Python sources (`scripts/run_hgps_metazoan_conservation.py` and `scripts/jm105_metazoan_distributed.py`) are verified locally with recorded SHA-256 values, but byte-for-byte connector import remains pending; the branch retains the prior canonical core lineage until the exact v2 bytes are imported. No claim of complete GitHub canonicalization is made before that import.',
              'The complete exact distributed workflow is canonicalized in draft PR #6. The two large Python sources were reconstructed from checksum-gated source chunks, verified against their recorded SHA-256 values, compiled successfully, and committed; the temporary importer removed itself in the same commit.',
          )
          handoff.write_text(text, encoding='utf-8')
          PY

          rm -rf .source-import
          rm -f .github/workflows/import-jm105-exact-sources.yml

      - name: Commit exact sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import exact distributed JM105 sources'
          git push
